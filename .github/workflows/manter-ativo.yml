name: Manter Supabase Ativo

on:
  schedule:
    # Roda a cada 3 dias às 09:00 UTC (06:00 BRT)
    - cron: '0 9 */3 * *'
  workflow_dispatch: # Permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping na API (Mantém Ativo)
        run: |
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/" > /dev/null
