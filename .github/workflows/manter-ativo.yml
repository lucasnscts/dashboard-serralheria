name: Manter Supabase Ativo

on:
  schedule:
    # Roda a cada 3 dias às 09:00 UTC (06:00 BRT)
    - cron: '0 9 */3 * *'
  workflow_dispatch: # Permite rodar manualmente no botão

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping na API do Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          "${{ secrets.SUPABASE_URL }}/rest/v1/atividades?select=id&limit=1"
